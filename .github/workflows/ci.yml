name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chronicle
          POSTGRES_PASSWORD: chronicle
          POSTGRES_DB: chronicle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chronicle" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://chronicle:chronicle@localhost:5432/chronicle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - name: Apply migrations to a real pgvector database
        working-directory: apps/api
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Live build: replaced by a single-universe eval smoke test once evals/run_eval.py exists.
  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run eval smoke test if the harness exists
        run: |
          if [ -f evals/run_eval.py ]; then
            echo "eval harness present; wire the smoke run here"
          else
            echo "evals/run_eval.py is built live; skipping"
          fi
